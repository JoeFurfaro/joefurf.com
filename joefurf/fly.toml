# fly.toml app configuration file generated for joefurf on 2026-01-25T07:50:47-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'joefurf'
primary_region = 'ord'

[build]

[env]
  NODE_ENV = 'production'
  PUBLIC_URL = 'https://joefurf.com'
  DATA_DIR = '/data'
  PORT = '8080'

# SQLite lives on this volume. A volume belongs to one machine, so the app runs on a single machine.
[mounts]
  source = 'joefurf_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    path = '/healthz'
    timeout = '5s'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
